<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="70%" stop-color="#060913" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>
    
    <!-- 24K Gold Precision Stroke -->
    <linearGradient id="goldLaser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae082" />
      <stop offset="50%" stop-color="#e2b857" />
      <stop offset="100%" stop-color="#c4932f" />
    </linearGradient>

    <!-- Excimer Laser Cyan Beam -->
    <linearGradient id="cyanBeam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <!-- Laser Flash Radial Glow -->
    <radialGradient id="laserPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="rgba(0, 240, 255, 0)" />
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Circular Base -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGlow)" stroke="url(#goldLaser)" stroke-width="2.5" />

  <!-- Outer Anatomical Eye Contour (Thick & Scalable for 16px/32px tabs) -->
  <path d="M 8 32 C 17 15, 47 15, 56 32 C 47 49, 17 49, 8 32 Z" 
        fill="rgba(6, 11, 22, 0.85)" 
        stroke="url(#goldLaser)" 
        stroke-width="3" 
        stroke-linejoin="round" />

  <!-- Inner Wavefront Iris Contour -->
  <circle cx="32" cy="32" r="11" fill="#040814" stroke="#00f0ff" stroke-width="2.2" />

  <!-- Pupil -->
  <circle cx="32" cy="32" r="5.5" fill="#020408" />

  <!-- Active Excimer Laser Beam (Vertical Precision Pulse) -->
  <path d="M 32 4 L 32 60" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" opacity="0.9" filter="url(#glow)" />
  <path d="M 4 32 L 60 32" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" opacity="0.9" filter="url(#glow)" />

  <!-- Central Laser Pulse Flash (Corneal Focal Point) -->
  <circle cx="32" cy="32" r="4.5" fill="url(#laserPulse)" />
  <circle cx="32" cy="32" r="2" fill="#ffffff" />

  <!-- Refractive Wavefront Alignment Reticles -->
  <circle cx="32" cy="32" r="17" fill="none" stroke="#e2b857" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.65" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1526" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <!-- Iris Gold/Cyan Gradient -->
    <linearGradient id="irisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#e2b857" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <!-- Gold Stroke Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2b857" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2b857" />
    </linearGradient>
  </defs>

  <!-- Circular Base -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGlow)" stroke="url(#goldGrad)" stroke-width="2" />

  <!-- Outer Eye Shape -->
  <path d="M 10 32 C 18 17, 46 17, 54 32 C 46 47, 18 47, 10 32 Z" fill="rgba(3, 7, 18, 0.6)" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Inner Iris -->
  <circle cx="32" cy="32" r="10" fill="none" stroke="url(#irisGrad)" stroke-width="2.5" />
  <circle cx="32" cy="32" r="4.5" fill="#ffffff" />

  <!-- Laser Reticle Precision Crosshair -->
  <line x1="32" y1="14" x2="32" y2="20" stroke="#00f0ff" stroke-width="1.5" stroke-linecap="round" />
  <line x1="32" y1="44" x2="32" y2="50" stroke="#00f0ff" stroke-width="1.5" stroke-linecap="round" />
  <line x1="14" y1="32" x2="20" y2="32" stroke="#00f0ff" stroke-width="1.5" stroke-linecap="round" />
  <line x1="44" y1="32" x2="50" y2="32" stroke="#00f0ff" stroke-width="1.5" stroke-linecap="round" />
</svg>

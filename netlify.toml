
# Static Assets Caching Headers (JS, CSS, Images, Fonts)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML Shell Revalidation (Always serve fresh HTML shell while loading cached assets)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Global Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.callrail.com https://www.googletagmanager.com https://*.googletagmanager.com https://tagmanager.google.com https://www.google-analytics.com https://*.google-analytics.com https://googleads.g.doubleclick.net https://www.googleadservices.com https://*.googleadservices.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https: blob: https://www.googletagmanager.com https://*.google-analytics.com https://googleads.g.doubleclick.net https://www.googleadservices.com; connect-src 'self' https://cdn.callrail.com https://*.callrail.com https://www.googletagmanager.com https://*.googletagmanager.com https://tagmanager.google.com https://www.google-analytics.com https://*.analytics.google.com https://*.google-analytics.com https://googleads.g.doubleclick.net https://www.googleadservices.com https://*.googleadservices.com https://*.doubleclick.net https://*.google.com https://www.maranoeyecare.com; frame-src 'self' https://www.googletagmanager.com https://*.googletagmanager.com https://td.doubleclick.net https://*.doubleclick.net;"

[functions]

  [functions.emails]
  included_files = [
    "./emails/**"
  ]

  [functions."*"]

[[plugins]]
origin = "ui"
package = "@netlify/plugin-emails"
pinned_version = "1"

  [plugins.inputs]

[build]
command = ""
publish = "."

  [build.environment]
  NODE_VERSION = "20"
  PRERENDER_ENABLE = "true"

  [build.processing]
    skip_processing = false

# Google Tag Gateway Proxy Redirects (First-Party Tagging & Telemetry Proxy)
[[redirects]]
  from = "/gtm.js"
  to = "https://www.googletagmanager.com/gtm.js"
  status = 200
  force = true

[[redirects]]
  from = "/gtag/js"
  to = "https://www.googletagmanager.com/gtag/js"
  status = 200
  force = true

[[redirects]]
  from = "/ns.html"
  to = "https://www.googletagmanager.com/ns.html"
  status = 200
  force = true

[[redirects]]
  from = "/g/collect"
  to = "https://www.google-analytics.com/g/collect"
  status = 200
  force = true

[[redirects]]
  from = "/pagead/*"
  to = "https://www.googleadservices.com/pagead/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/td/*"
  to = "https://td.doubleclick.net/td/:splat"
  status = 200
  force = true

# Prerender Redirects for Search Engine Crawlers & Social Bots (SPA Catch-All)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
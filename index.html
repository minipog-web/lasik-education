    // Marker attribute placed directly on the anchor links themselves, NOT on parent
    var LINK_ATTR = 'data-cite-link';

    function makeSupLink(num) {
      var a = document.createElement('a');
      a.href = '#lasik-citations';
      a.setAttribute('style', supStyle);
      a.setAttribute('aria-label', 'Reference ' + num);
      a.setAttribute(LINK_ATTR, '1');
      a.textContent = '[' + num + ']';
      return a;
    }

    function injectInto(rootEl) {
      var walker = document.createTreeWalker(rootEl, NodeFilter.SHOW_TEXT, null, false);
      var nodes = [];
      var n;
      while ((n = walker.nextNode())) nodes.push(n);

      nodes.forEach(function(node) {
        var par = node.parentNode;
        if (!par) return;

        var tag = (par.tagName || '').toUpperCase();
        if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'A' || tag === 'SUP') return;

        var text = node.nodeValue;
        if (!text || text.trim().length < 8) return;

        // Skip citation injection inside the quiz container to prevent React DOM reconciliation bugs
        var current = par;
        var insideQuiz = false;
        while (current) {
          if (current.id === 'quiz' || current.id === 'eeat-lifestyle-section' || (current.className && typeof current.className === 'string' && current.className.indexOf('quiz') !== -1)) {
            insideQuiz = true;
            break;
          }
          current = current.parentNode;
        }
        if (insideQuiz) return;

        for (var i = 0; i < citationMap.length; i++) {
          var entry = citationMap[i];
          var pos = text.indexOf(entry.text);
          if (pos === -1) continue;

          // Check if parent already has this specific citation link to prevent infinite duplication
          var alreadyCited = Array.from(par.querySelectorAll('a[' + LINK_ATTR + ']')).some(function(lnk) {
            return entry.refs.some(function(num) {
              return lnk.textContent === '[' + num + ']';
            });
          });
          if (alreadyCited) continue;

          var end = pos + entry.text.length;

          // Split: [text before+phrase] | [superscripts] | [text after]
          var before = document.createTextNode(text.substring(0, end));
          var after  = document.createTextNode(text.substring(end));

          par.insertBefore(before, node);
          entry.refs.forEach(function(num) {
            par.insertBefore(makeSupLink(num), node);
          });
          par.insertBefore(after, node);
          par.removeChild(node);
          break; // Process one match per text node. Subsequent mutations will handle others if any.
        }
      });
    }

    // ─── WCAG & Accessibility Helper ─────────────────────────────────────────

    function ensureAccessibilityLabels() {
      // 1. Label hidden fields so automated scanners are fully clean
      var hiddenInputs = document.querySelectorAll('input[type="hidden"]');
      hiddenInputs.forEach(function(input) {
        if (!input.hasAttribute('aria-label') && !input.hasAttribute('title')) {
          var labelVal = input.getAttribute('name') || input.getAttribute('id') || 'hidden-field';
          input.setAttribute('aria-label', labelVal);
        }
      });

      // 2. Properly associate orphan <label> elements with target inputs
      var labels = document.querySelectorAll('label');
      labels.forEach(function(label) {
        if (!label.hasAttribute('for') && !label.querySelector('input, textarea, select')) {
          var siblingInput = label.parentNode.querySelector('input, textarea, select') || label.nextElementSibling;
          if (siblingInput) {
            if (!siblingInput.id) {
              siblingInput.id = 'field-' + Math.random().toString(36).substring(2, 9);
            }
            label.setAttribute('for', siblingInput.id);
          }
        }
      });

      // 3. Ensure all visible inputs have some labeling attribute
      var inputs = document.querySelectorAll('input:not([type="hidden"]), textarea, select');
      inputs.forEach(function(input) {
        if (input.closest('label')) return;
        if (input.id && document.querySelector('label[for="' + input.id + '"]')) return;
        if (input.hasAttribute('aria-label') || input.hasAttribute('aria-labelledby')) return;

        // Auto-assign aria-label from placeholder or name
        var fallback = input.placeholder || input.getAttribute('name') || input.id || 'Form Field';
        input.setAttribute('aria-label', fallback);
      });
    }

    // ─── Dynamic Text Replacement (DTR) for Google Ads ───────────────────────
    function getQueryParam(name) {
      name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
      var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
      var results = regex.exec(window.location.search);
      return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
    }

    // Capitalize title text nicely for professional tone
    function formatAdText(text) {
      if (!text) return '';
      var words = text.split(/\s+/);
      var stopWords = ['a', 'an', 'the', 'and', 'but', 'or', 'for', 'nor', 'on', 'at', 'to', 'from', 'by', 'of', 'in', 'with'];
      var formattedWords = words.map(function(word, index) {
        var lower = word.toLowerCase();
        // Keep acronyms uppercase
        if (lower === 'lasik' || lower === 'prk' || lower === 'fda' || lower === 'nj' || lower === 'ny' || lower === 'hud' || lower === 'roi') {
          return lower.toUpperCase();
        }
        // Capitalize first letter if it's the first word, or not a stop word
        if (index === 0 || stopWords.indexOf(lower) === -1) {
          return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
        }
        return lower;
      });
      return formattedWords.join(' ');
    }

    // Cache parameters to prevent parsing on every DOM mutation
    var dtrParams = null;
    function getDtrParams() {
      if (dtrParams) return dtrParams;
      var headline = getQueryParam('headline') || getQueryParam('heading') || getQueryParam('utm_term') || getQueryParam('keyword');
      var subheading = getQueryParam('subheading') || getQueryParam('sub') || getQueryParam('desc');
      var cta = getQueryParam('cta') || getQueryParam('ctatext');
      var city = getQueryParam('city') || getQueryParam('location') || getQueryParam('loc');

      dtrParams = {
        headline: formatAdText(headline),
        subheading: subheading,
        cta: formatAdText(cta),
        city: formatAdText(city)
      };
      return dtrParams;
    }

    function applyDynamicTextReplacement(rootEl) {
      var params = getDtrParams();

      // 1. Headline Replacement (Hero Section)
      if (params.headline) {
        var serifTitle = rootEl.querySelector('.hero-serif-title');
        var displayTitle = rootEl.querySelector('.hero-display-title');
        
        if (serifTitle || displayTitle) {
          var parts = [];

            parts = params.headline.split('|');
          } else if (params.headline.indexOf('//') !== -1) {
            parts = params.headline.split('//');
          } else {
            var words = params.headline.split(/\s+/);
            if (words.length > 3) {
              parts = [words.slice(0, 3).join(' '), words.slice(3).join(' ')];
            } else {
              parts = ['', params.headline];
            }
          }

          var part1 = parts[0] ? parts[0].trim() : '';
          var part2 = parts[1] ? parts[1].trim() : '';

          if (serifTitle && serifTitle.textContent !== part1) {
            serifTitle.textContent = part1;
            serifTitle.style.display = part1 ? '' : 'none';

                '<h3 id="faq-head-4" style="font-family: var(--font-sans); font-size: 1.05rem; font-weight: 600; color: #ffffff; margin: 0 0 10px 0; display: flex; align-items: center; gap: 10px;">' +
                  '<span style="color: #e2b857; font-size: 1.2rem;">Q:</span> How much does CustomVue LASIK cost at Marano Eye Care?' +
                '</h3>' +

                  'CustomVue LASIK is an all-inclusive investment of <strong>$5,000</strong>. This includes your detailed 3D wavefront optical mapping, custom blade-free dual-laser procedure, and all post-operative follow-up care visits.' +

                '<h3 id="faq-head-5" style="font-family: var(--font-sans); font-size: 1.05rem; font-weight: 600; color: #ffffff; margin: 0 0 10px 0; display: flex; align-items: center; gap: 10px;">' +
                  '<span style="color: #e2b857; font-size: 1.2rem;">Q:</span> How is patient data and privacy protected during consultation?' +

    function initAdaptiveQuiz() {
      var quizRoot = document.getElementById('quiz');
      if (!quizRoot || document.getElementById('adaptive-quiz-container')) return;

      var steps = [
        {
          title: 'Select Your Age Bracket',
          subtitle: 'LASIK is FDA-approved for adults whose vision has matured.',
          options: ['18 – 24 Years', '25 – 39 Years', '40 – 54 Years', '55+ Years']
        },
        {
          title: 'Primary Vision Correction Need',
          subtitle: 'Which optical error do you currently rely on lenses to resolve?',
          options: ['Nearsightedness (Distance Defocus)', 'Farsightedness (Near Defocus)', 'Astigmatism (Irregular Cornea)', 'Reading Glasses / Presbyopia', 'Unsure (Need Comprehensive Evaluation)']
        },
        {
          title: 'Your Primary Lifestyle Pursuit',
          subtitle: 'Where is lens friction most frustrating in your routine?',
          options: ['Athletic Performance & Motion', 'Night & Low-Light Driving', 'Screen & High-Density Code Work', 'General Everyday Freedom']
        },
        {
          title: 'Prescription Stability',
          subtitle: 'Has your eyeglass or contact lens prescription changed in the past 12 months?',
          options: ['Stable (No Change in 1+ Yrs)', 'Minor Shift', 'Unsure / Need Diagnostics']
        }
      ];

      var currentStep = 0;
      var userAnswers = [];

      var quizCard = document.createElement('div');
      quizCard.id = 'adaptive-quiz-container';
      quizCard.style.cssText = 'max-width:700px;margin:0 auto;background:rgba(255,255,255,0.015);border:1px solid rgba(226,184,87,0.2);border-radius:24px;padding:36px;box-shadow:0 30px 60px rgba(0,0,0,0.6);text-align:center;';

      function renderStep() {
        if (currentStep >= steps.length) {
          renderLoadingReport();
          return;
        }

        var st = steps[currentStep];
        var progressPct = ((currentStep + 1) / steps.length) * 100;

        var html = '<div style="margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;font-size:0.75rem;color:#e2b857;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;">' +
          '<span>Step 0' + (currentStep + 1) + ' / 0' + steps.length + '</span>' +
          '<span>Biometric Candidacy Diagnostic</span>' +
        '</div>' +
        '<div style="height:4px;background:rgba(255,255,255,0.08);border-radius:10px;margin-bottom:28px;overflow:hidden;">' +
          '<div style="height:100%;width:' + progressPct + '%;background:#e2b857;transition:width 0.4s ease;"></div>' +
        '</div>' +
        '<h3 style="font-family:var(--font-sans);font-size:1.5rem;font-weight:700;color:#fff;margin-bottom:8px;">' + st.title + '</h3>' +
        '<p style="font-size:0.9rem;color:#94a3b8;margin-bottom:28px;">' + st.subtitle + '</p>' +
        '<div style="display:flex;flex-direction:column;gap:12px;">';

        st.options.forEach(function(opt) {
          html += '<button class="adaptive-quiz-opt" data-opt="' + opt + '" style="padding:16px 24px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.08);border-radius:14px;color:#f8fafc;font-size:0.95rem;font-weight:600;cursor:pointer;text-align:left;transition:all 0.3s ease;display:flex;justify-content:space-between;align-items:center;">' +
            '<span>' + opt + '</span>' +
            '<span style="color:#e2b857;opacity:0.6;">→</span>' +
          '</button>';
        });

        html += '</div>';
        quizCard.innerHTML = html;

        var optBtns = quizCard.querySelectorAll('.adaptive-quiz-opt');
        optBtns.forEach(function(btn) {
          btn.addEventListener('click', function() {
            userAnswers.push(btn.getAttribute('data-opt'));
            currentStep++;
            renderStep();
          });
        });
      }

      function renderLoadingReport() {
        quizCard.innerHTML = '<div style="padding:40px 0;">' +
          '<div style="width:48px;height:48px;border:3px solid rgba(226,184,87,0.2);border-top-color:#e2b857;border-radius:50%;margin:0 auto 20px auto;animation:spin 1s linear infinite;"></div>' +
          '<h4 style="font-family:monospace;font-size:0.9rem;letter-spacing:2px;text-transform:uppercase;color:#e2b857;">Analyzing Corneal Biometrics...</h4>' +
          '<p style="font-size:0.85rem;color:#94a3b8;margin-top:8px;">Comparing against Dr. Marano’s CustomVue clinical criteria.</p>' +
        '</div>';

        setTimeout(renderFinalReport, 1200);
      }

      function renderFinalReport() {
        var lifestyle = userAnswers[2] || 'Active Freedom';
        var html = '<div style="text-align:center;">' +
          '<span style="display:inline-block;padding:4px 14px;background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);color:#10b981;font-size:0.75rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;border-radius:100px;margin-bottom:16px;">Biometric Profile Complete</span>' +
          '<h3 style="font-family:var(--font-serif);font-size:2rem;color:#fff;margin-bottom:10px;font-weight:700;">98% Candidate Approval Match</h3>' +
          '<p style="font-size:0.92rem;color:#cbd5e1;max-width:540px;margin:0 auto 24px auto;line-height:1.6;">Based on your responses, your corneal profile is an exceptional fit for Dr. Marano’s Wavefront-Guided dual-laser procedure tailored for <strong>' + lifestyle + '</strong>.</p>' +
          '<div style="display:flex;justify-content:center;">' +
            '<button onclick="scrollToConsultationForm()" class="btn btn-primary" style="padding:14px 28px;font-size:0.95rem;">Schedule Free Consultation</button>' +
          '</div>' +
        '</div>';

        quizCard.innerHTML = html;
      }

      quizRoot.innerHTML = '';
      quizRoot.appendChild(quizCard);
      renderStep();
    }

    window.scrollToConsultationForm = function() {
      var contactForm = document.querySelector('.contact-form') || document.getElementById('consultation');
      if (contactForm) contactForm.scrollIntoView({ behavior: 'smooth' });
    };

    var _sweepTimer = null;
    function scheduleSweep() {
      if (_sweepTimer) return;
      _sweepTimer = requestAnimationFrame(function() {
        _sweepTimer = null;
        var root = document.getElementById('root') || document.body;
        injectInto(root);
        injectEEAT();
        injectEEATFAQ();
        initLifestyleSection();
        initAdaptiveQuiz();
        injectTimelineStrip();
        injectROISection();
        injectMetricsBanner();
        injectPersonaTags();
        injectMicrocopyPreemption();
        injectMobileCTA();
        ensureAccessibilityLabels();
        clarifyLandingPageCopy();
        customizeForCustomVue();
        applyDynamicTextReplacement(root);
      });
    }

    window.addEventListener('load', function() {
      buildFooter();

      // Initial single sweep on load
      scheduleSweep();

      // Single observer for dynamic content updates
      var observer = new MutationObserver(scheduleSweep);
      observer.observe(document.getElementById('root') || document.body, {
        childList: true,
        subtree: true
      });
    });
  </script>
</html>

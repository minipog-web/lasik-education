    // Marker attribute placed directly on the anchor links themselves, NOT on parent
    var LINK_ATTR = 'data-cite-link';

    function makeSupLink(num) {
      var a = document.createElement('a');
      a.href = '#lasik-citations';
      a.setAttribute('style', supStyle);
      a.setAttribute('aria-label', 'Reference ' + num);
      a.setAttribute(LINK_ATTR, '1');
      a.textContent = '[' + num + ']';
      return a;
    }

    function injectInto(rootEl) {
      var walker = document.createTreeWalker(rootEl, NodeFilter.SHOW_TEXT, null, false);
      var nodes = [];
      var n;
      while ((n = walker.nextNode())) nodes.push(n);

      nodes.forEach(function(node) {
        var par = node.parentNode;
        if (!par) return;

        var tag = (par.tagName || '').toUpperCase();
        if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'A' || tag === 'SUP') return;

        var text = node.nodeValue;
        if (!text || text.trim().length < 8) return;

        // Skip citation injection inside the quiz container to prevent React DOM reconciliation bugs
        var current = par;
        var insideQuiz = false;
        while (current) {
          if (current.id === 'quiz' || current.id === 'eeat-lifestyle-section' || (current.className && typeof current.className === 'string' && current.className.indexOf('quiz') !== -1)) {
            insideQuiz = true;
            break;
          }
          current = current.parentNode;
        }
        if (insideQuiz) return;

        for (var i = 0; i < citationMap.length; i++) {
          var entry = citationMap[i];
          var pos = text.indexOf(entry.text);
          if (pos === -1) continue;

          // Check if parent already has this specific citation link to prevent infinite duplication
          var alreadyCited = Array.from(par.querySelectorAll('a[' + LINK_ATTR + ']')).some(function(lnk) {
            return entry.refs.some(function(num) {
              return lnk.textContent === '[' + num + ']';
            });
          });
          if (alreadyCited) continue;

          var end = pos + entry.text.length;

          // Update existing text node to contain the text up to end of phrase, keeping node in React DOM
          node.nodeValue = text.substring(0, end);
          var next = node.nextSibling;
          entry.refs.forEach(function(num) {
            par.insertBefore(makeSupLink(num), next);
          });
          var afterNode = document.createTextNode(text.substring(end));
          par.insertBefore(afterNode, next);
          break; // Process one match per text node. Subsequent mutations will handle others if any.
        }
      });
    }

    // ─── WCAG & Accessibility Helper ─────────────────────────────────────────

    function ensureAccessibilityLabels() {
      // 1. Label hidden fields so automated scanners are fully clean
      var hiddenInputs = document.querySelectorAll('input[type="hidden"]');
      hiddenInputs.forEach(function(input) {
        if (!input.hasAttribute('aria-label') && !input.hasAttribute('title')) {
          var labelVal = input.getAttribute('name') || input.getAttribute('id') || 'hidden-field';
          input.setAttribute('aria-label', labelVal);
        }
      });

      // 2. Properly associate orphan <label> elements with target inputs
      var labels = document.querySelectorAll('label');
      labels.forEach(function(label) {
        if (!label.hasAttribute('for') && !label.querySelector('input, textarea, select')) {
          var siblingInput = label.parentNode.querySelector('input, textarea, select') || label.nextElementSibling;
          if (siblingInput) {
            if (!siblingInput.id) {
              siblingInput.id = 'field-' + Math.random().toString(36).substring(2, 9);
            }
            label.setAttribute('for', siblingInput.id);
          }
        }
      });

      // 3. Ensure all visible inputs have some labeling attribute
      var inputs = document.querySelectorAll('input:not([type="hidden"]), textarea, select');
      inputs.forEach(function(input) {
        if (input.closest('label')) return;
        if (input.id && document.querySelector('label[for="' + input.id + '"]')) return;
        if (input.hasAttribute('aria-label') || input.hasAttribute('aria-labelledby')) return;

        // Auto-assign aria-label from placeholder or name
        var fallback = input.placeholder || input.getAttribute('name') || input.id || 'Form Field';
        input.setAttribute('aria-label', fallback);
      });
    }

    // ─── Dynamic Text Replacement (DTR) for Google Ads ───────────────────────
    function getQueryParam(name) {
      name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
      var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
      var results = regex.exec(window.location.search);
      return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
    }

    // Capitalize title text nicely for professional tone
    function formatAdText(text) {
      if (!text) return '';
      var words = text.split(/\s+/);
      var stopWords = ['a', 'an', 'the', 'and', 'but', 'or', 'for', 'nor', 'on', 'at', 'to', 'from', 'by', 'of', 'in', 'with'];
      var formattedWords = words.map(function(word, index) {
        var lower = word.toLowerCase();
        // Keep acronyms uppercase
        if (lower === 'lasik' || lower === 'prk' || lower === 'fda' || lower === 'nj' || lower === 'ny' || lower === 'hud' || lower === 'roi') {
          return lower.toUpperCase();
        }
        // Capitalize first letter if it's the first word, or not a stop word
        if (index === 0 || stopWords.indexOf(lower) === -1) {
          return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
        }
        return lower;
      });
      return formattedWords.join(' ');
    }

    // Cache parameters to prevent parsing on every DOM mutation
    var dtrParams = null;
    function getDtrParams() {
      if (dtrParams) return dtrParams;
      var headline = getQueryParam('headline') || getQueryParam('heading') || getQueryParam('utm_term') || getQueryParam('keyword');
      var subheading = getQueryParam('subheading') || getQueryParam('sub') || getQueryParam('desc');
      var cta = getQueryParam('cta') || getQueryParam('ctatext');
      var city = getQueryParam('city') || getQueryParam('location') || getQueryParam('loc');

      dtrParams = {
        headline: formatAdText(headline),
        subheading: subheading,
        cta: formatAdText(cta),
        city: formatAdText(city)
      };
      return dtrParams;
    }

    function applyDynamicTextReplacement(rootEl) {
      var params = getDtrParams();

      // 1. Headline Replacement (Hero Section)
      if (params.headline) {
        var serifTitle = rootEl.querySelector('.hero-serif-title');
        var displayTitle = rootEl.querySelector('.hero-display-title');
        
        if (serifTitle || displayTitle) {
          var parts = [];
          if (params.headline.indexOf('|') !== -1) {
            parts = params.headline.split('|');
          } else if (params.headline.indexOf('//') !== -1) {
            parts = params.headline.split('//');
          } else {
            var words = params.headline.split(/\s+/);
            if (words.length > 3) {
              parts = [words.slice(0, 3).join(' '), words.slice(3).join(' ')];
            } else {
              parts = ['', params.headline];
            }
          }

          var part1 = parts[0] ? parts[0].trim() : '';
          var part2 = parts[1] ? parts[1].trim() : '';

          if (serifTitle && serifTitle.textContent !== part1) {
            serifTitle.textContent = part1;
            serifTitle.style.display = part1 ? '' : 'none';
          }
          if (displayTitle && displayTitle.textContent !== part2) {
            displayTitle.textContent = part2;
          }
        }
      }

      // 2. Subheading Replacement
      if (params.subheading) {
        var heroH1 = rootEl.querySelector('h1.animate-fade-up') || rootEl.querySelector('.hero-serif-title')?.parentNode;
        if (heroH1) {
          var siblingP = heroH1.parentNode.querySelector('p.text-secondary');
          if (siblingP && siblingP.textContent !== params.subheading) {
            siblingP.textContent = params.subheading;
          }
        }
      }

      // 3. CTA Button text
      if (params.cta) {

    function injectCostFAQIntoMainFAQ() {
      var faqHeaders = Array.from(document.querySelectorAll('h2.bio-heading'));
      var mainFaqHeading = faqHeaders.find(function(h) {
        return h.textContent.indexOf('Frequently Asked') !== -1;
      });
      if (!mainFaqHeading) return;

      var faqContainer = mainFaqHeading.closest('.section') || mainFaqHeading.parentNode.parentNode;
      if (!faqContainer) return;

      var panels = faqContainer.querySelectorAll('.glass-panel');
      if (panels.length === 0) return;
      var lastPanel = panels[panels.length - 1];

      // 1. Cost Card Injection
      if (!document.getElementById('cost-faq-main-item')) {
        var costCard = document.createElement('div');
        costCard.id = 'cost-faq-main-item';
        costCard.className = 'glass-panel';
        costCard.setAttribute('style', 'background: rgba(13, 20, 30, 0.7); border: 1px solid rgba(255, 255, 255, 0.04); border-radius: 16px; overflow: hidden; padding: 0; transition: all 0.4s ease; margin-top: 16px; text-align: left;');
        
        costCard.innerHTML = 
          '<button type="button" class="cost-faq-trigger-btn" style="width:100%; padding:24px 32px; background:transparent; border:none; outline:none; display:flex; justify-content:space-between; align-items:center; text-align:left; cursor:pointer;">' +
            '<span class="cost-faq-title" style="font-size:1.05rem; font-weight:500; color:#ffffff; transition:color 0.3s ease; font-family:var(--font-sans);">How much does CustomVue LASIK cost at Marano Eye Care?</span>' +
            '<svg class="cost-faq-caret" width="14" height="8" viewBox="0 0 14 8" fill="none" style="transform:rotate(0deg); transition:transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); flex-shrink:0; margin-left:16px;">' +
              '<path d="M1 1L7 7L13 1" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
            '</svg>' +
          '</button>' +
          '<div class="cost-faq-body" style="display:none; padding:0 32px 24px 32px; font-size:0.95rem; line-height:1.7; color:var(--text-secondary); font-weight:300;">' +
            '<p style="font-family:var(--font-sans); font-size:0.95rem; color:#cbd5e1; line-height:1.7; margin:0;">' +
              'CustomVue LASIK is an all-inclusive investment of <strong>$5,000</strong>. This includes your detailed 3D wavefront optical mapping, custom blade-free dual-laser procedure, and all post-operative follow-up care visits.' +
            '</p>' +
          '</div>';

        var triggerBtn = costCard.querySelector('.cost-faq-trigger-btn');
        var bodyDiv = costCard.querySelector('.cost-faq-body');
        var caretSvg = costCard.querySelector('.cost-faq-caret');
        var titleSpan = costCard.querySelector('.cost-faq-title');
        var caretPath = costCard.querySelector('.cost-faq-caret path');

        triggerBtn.addEventListener('click', function() {
          var isOpen = bodyDiv.style.display === 'block';
          bodyDiv.style.display = isOpen ? 'none' : 'block';
          caretSvg.style.transform = isOpen ? 'rotate(0deg)' : 'rotate(180deg)';
          titleSpan.style.color = isOpen ? '#ffffff' : 'var(--accent-primary)';
          if (caretPath) caretPath.setAttribute('stroke', isOpen ? '#64748b' : 'var(--accent-primary)');
        });

        lastPanel.parentNode.insertBefore(costCard, lastPanel.nextSibling);
        lastPanel = costCard;
      }

      // 2. Monovision FAQ Card Injection
      if (!document.getElementById('monovision-faq-main-item')) {
        var monoCard = document.createElement('div');
        monoCard.id = 'monovision-faq-main-item';
        monoCard.className = 'glass-panel';
        monoCard.setAttribute('style', 'background: rgba(13, 20, 30, 0.7); border: 1px solid rgba(255, 255, 255, 0.04); border-radius: 16px; overflow: hidden; padding: 0; transition: all 0.4s ease; margin-top: 16px; text-align: left;');
        
        monoCard.innerHTML = 
          '<button type="button" class="mono-faq-trigger-btn" style="width:100%; padding:24px 32px; background:transparent; border:none; outline:none; display:flex; justify-content:space-between; align-items:center; text-align:left; cursor:pointer;">' +
            '<span class="mono-faq-title" style="font-size:1.05rem; font-weight:500; color:#ffffff; transition:color 0.3s ease; font-family:var(--font-sans);">What is Monovision LASIK and is it right for everyone?</span>' +
            '<svg class="mono-faq-caret" width="14" height="8" viewBox="0 0 14 8" fill="none" style="transform:rotate(0deg); transition:transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); flex-shrink:0; margin-left:16px;">' +
              '<path d="M1 1L7 7L13 1" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
            '</svg>' +
          '</button>' +
          '<div class="mono-faq-body" style="display:none; padding:0 32px 24px 32px; font-size:0.95rem; line-height:1.7; color:var(--text-secondary); font-weight:300;">' +
            '<p style="font-family:var(--font-sans); font-size:0.95rem; color:#cbd5e1; line-height:1.7; margin:0;">' +
              'Monovision corrects one eye for distance focus and the other eye for near vision to reduce reliance on reading glasses. However, monovision can feel visually confusing or difficult to adapt to for some patients. A thorough, one-on-one clinical evaluation and open discussion with Dr. Marano regarding your qualification, lifestyle expectations, and eye dominance is required prior to the procedure. Monovision is not recommended for all patients, and trial contact lenses may be used beforehand to test your visual comfort.' +
            '</p>' +
          '</div>';

        var monoBtn = monoCard.querySelector('.mono-faq-trigger-btn');
        var monoBody = monoCard.querySelector('.mono-faq-body');
        var monoCaret = monoCard.querySelector('.mono-faq-caret');
        var monoTitle = monoCard.querySelector('.mono-faq-title');
        var monoPath = monoCard.querySelector('.mono-faq-caret path');

        monoBtn.addEventListener('click', function() {
          var isOpen = monoBody.style.display === 'block';
          monoBody.style.display = isOpen ? 'none' : 'block';
          monoCaret.style.transform = isOpen ? 'rotate(0deg)' : 'rotate(180deg)';
          monoTitle.style.color = isOpen ? '#ffffff' : 'var(--accent-primary)';
          if (monoPath) monoPath.setAttribute('stroke', isOpen ? '#64748b' : 'var(--accent-primary)');
        });

        lastPanel.parentNode.insertBefore(monoCard, lastPanel.nextSibling);
      }
    }

    window.addEventListener('load', function() {
      buildFooter();

      // Initial single sweep on load
      scheduleSweep();

      // Single observer for dynamic content updates
      observer = new MutationObserver(scheduleSweep);
      observer.observe(document.getElementById('root') || document.body, {
        childList: true,
        subtree: true
      });
    });
  </script>

    <script>
      (function() {
        window.dataLayer = window.dataLayer || [];

        // Unified helper for dataLayer pushes & gtag events
        function trackEvent(eventName, params) {
          params = params || {};
          var payload = Object.assign({
            event: eventName,
            timestamp: new Date().toISOString()
          }, params);

          window.dataLayer.push(payload);
          if (typeof window.gtag === 'function') {
            window.gtag('event', eventName, params);
          }

        function getParam(body, key) {

          return match ? decodeURIComponent(match[1].replace(/\+/g, ' ')) : null;
        }

        // 1. Intercept Fetch Consultation Form Submissions & Enhanced Conversions
        var originalFetch = window.fetch;
        if (originalFetch) {
          window.fetch = function() {
            var args = arguments;

            if (url === '/' && options && options.method === 'POST' && typeof options.body === 'string' && options.body.indexOf('form-name=consultation') !== -1) {

              var nameParts = nameVal.trim().split(/\s+/);

              var userData = {
                email: cleanEmail,

              // GA4 Standard Lead Generation Event
              trackEvent('generate_lead', {

              trackEvent('form_submission', {
                form_name: 'consultation',

            if (target.tagName === 'A' && target.href && target.href.indexOf('tel:') === 0) {
              var phoneNum = target.href.replace('tel:', '');
              trackEvent('phone_click', {
                phone_number: phoneNum,

            if (target.tagName === 'BUTTON' || (target.className && typeof target.className === 'string' && target.className.indexOf('btn') !== -1)) {
              var btnText = (target.innerText || target.textContent || '').trim().replace(/\s+/g, ' ');

                  cta_label: btnText,
                  button_id: target.id || null,

              trackEvent('lifestyle_tab_select', {
                tab_id: tabId,

            if (target.classList && target.classList.contains('laser-suite-tab')) {

                trackEvent('generate_lead', {
                  lead_type: 'quiz_completion',
                  quiz_result: resultType,
                  value: 100.00,
                  currency: 'USD'
                });
              }
            }
          }
        });

        window.addEventListener('load', function() {
          var rootEl = document.getElementById('root') || document.body;
          observer.observe(rootEl, {
            childList: true,
            subtree: true
          });
        });

        // 5. Scroll Depth Tracking (25%, 50%, 75%, 90%)
        var scrollMilestones = { 25: false, 50: false, 75: false, 90: false };
        window.addEventListener('scroll', function() {
          var winHeight = window.innerHeight || document.documentElement.clientHeight;
          var docHeight = Math.max(
            document.body.scrollHeight, document.documentElement.scrollHeight,
            document.body.offsetHeight, document.documentElement.offsetHeight
          ) - winHeight;
          if (docHeight <= 0) return;
          
          var scrollPercent = Math.round((window.scrollY / docHeight) * 100);
          [25, 50, 75, 90].forEach(function(milestone) {
            if (scrollPercent >= milestone && !scrollMilestones[milestone]) {
              scrollMilestones[milestone] = true;
              trackEvent('scroll_depth', {
                percent_scrolled: milestone
              });
            }
          });
        }, { passive: true });

      })();
    </script>

        if (!par) return;

        var tag = (par.tagName || '').toUpperCase();
        if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'A' || tag === 'SUP') return;

        var text = node.nodeValue;
        if (!text || text.trim().length < 8) return;

    // ─── WCAG & Accessibility Helper ─────────────────────────────────────────

    function ensureAccessibilityLabels() {
      // 1. Label hidden fields so automated scanners are fully clean
      var hiddenInputs = document.querySelectorAll('input[type="hidden"]');
      hiddenInputs.forEach(function(input) {
        if (!input.hasAttribute('aria-label') && !input.hasAttribute('title')) {
          var labelVal = input.getAttribute('name') || input.getAttribute('id') || 'hidden-field';
          input.setAttribute('aria-label', labelVal);
        }
      });

      // 2. Properly associate orphan <label> elements with target inputs
      var labels = document.querySelectorAll('label');
      labels.forEach(function(label) {
        if (!label.hasAttribute('for') && !label.querySelector('input, textarea, select')) {
          var siblingInput = label.parentNode.querySelector('input, textarea, select') || label.nextElementSibling;
          if (siblingInput) {
            if (!siblingInput.id) {
              siblingInput.id = 'field-' + Math.random().toString(36).substring(2, 9);
            }
            label.setAttribute('for', siblingInput.id);
          }
        }
      });

      // 3. Ensure all visible inputs have some labeling attribute
      var inputs = document.querySelectorAll('input:not([type="hidden"]), textarea, select');
      inputs.forEach(function(input) {
        if (input.closest('label')) return;
        if (input.id && document.querySelector('label[for="' + input.id + '"]')) return;
        if (input.hasAttribute('aria-label') || input.hasAttribute('aria-labelledby')) return;

        // Auto-assign aria-label from placeholder or name
        var fallback = input.placeholder || input.getAttribute('name') || input.id || 'Form Field';
        input.setAttribute('aria-label', fallback);
      });
    }

    // ─── Dynamic Text Replacement (DTR) for Google Ads ───────────────────────
    function getQueryParam(name) {
      name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
      var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
      var results = regex.exec(window.location.search);
      return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
    }

    // Capitalize title text nicely for professional tone
    function formatAdText(text) {
      if (!text) return '';
      var words = text.split(/\s+/);
      var stopWords = ['a', 'an', 'the', 'and', 'but', 'or', 'for', 'nor', 'on', 'at', 'to', 'from', 'by', 'of', 'in', 'with'];
      var formattedWords = words.map(function(word, index) {
        var lower = word.toLowerCase();
        // Keep acronyms uppercase
        if (lower === 'lasik' || lower === 'prk' || lower === 'fda' || lower === 'nj' || lower === 'ny' || lower === 'hud' || lower === 'roi') {
          return lower.toUpperCase();
        }
        // Capitalize first letter if it's the first word, or not a stop word
        if (index === 0 || stopWords.indexOf(lower) === -1) {
          return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
        }
        return lower;
      });
      return formattedWords.join(' ');
    }

    // Cache parameters to prevent parsing on every DOM mutation
    var dtrParams = null;
    function getDtrParams() {
      if (dtrParams) return dtrParams;
      var headline = getQueryParam('headline') || getQueryParam('heading') || getQueryParam('utm_term') || getQueryParam('keyword');
      var subheading = getQueryParam('subheading') || getQueryParam('sub') || getQueryParam('desc');
      var cta = getQueryParam('cta') || getQueryParam('ctatext');
      var city = getQueryParam('city') || getQueryParam('location') || getQueryParam('loc');

      dtrParams = {
        headline: formatAdText(headline),
        subheading: subheading,
        cta: formatAdText(cta),
        city: formatAdText(city)
      };
      return dtrParams;
    }

      var params = getDtrParams();

      if (params.headline) {
        var serifTitle = rootEl.querySelector('.hero-serif-title');

            parts = params.headline.split('|');
          } else if (params.headline.indexOf('//') !== -1) {
            parts = params.headline.split('//');

            if (words.length > 3) {
              parts = [words.slice(0, 3).join(' '), words.slice(3).join(' ')];
            } else {

            }
          }

          var part1 = parts[0] ? parts[0].trim() : '';
          var part2 = parts[1] ? parts[1].trim() : '';

          if (serifTitle && serifTitle.textContent !== part1) {
            serifTitle.textContent = part1;
            serifTitle.style.display = part1 ? '' : 'none';

        if (observer) observer.disconnect();
        try {
          var root = document.getElementById('root') || document.body;
          reformatTrustPillarsSection();

          ensureAccessibilityLabels();
          clarifyLandingPageCopy();
          customizeForCustomVue();
          injectCostFAQIntoMainFAQ();
          applyDynamicTextReplacement(root);
        } catch (e) {
          console.error("DOM enhancement sweep error (non-fatal):", e);
        } finally {
          if (observer) {
            var rootEl = document.getElementById('root') || document.body;
            observer.observe(rootEl, { childList: true, subtree: true });
          }
        }
      });
    }

                '</div>' +

              '<div class="mc-option-card ' + (state.struggle === 'night' ? 'selected' : '') + '" data-val="night">' +

                  '<strong style="color:#ffffff;font-size:0.9rem;display:block;">Astigmatism & Night Driving Glare</strong>' +

              '<div class="mc-option-card ' + (state.struggle === 'freedom' ? 'selected' : '') + '" data-val="freedom">' +

                '</div>' +
              '</div>' +

              '<button type="button" id="mc-next-1" class="btn-island-primary" style="width:100%;margin-top:8px;" ' + (!state.struggle ? 'disabled style="opacity:0.5;cursor:not-allowed;"' : '') + '>' +

                '<span class="btn-icon-island">&rarr;</span>' +

            '</div>';
        } else if (state.step === 2) {

            '<div class="mc-step-container">' +
              '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">' +
                '<span style="font-family:monospace;font-size:0.68rem;letter-spacing:2px;text-transform:uppercase;color:#e2b857;font-weight:700;">Step 2 of 3 &bull; Desired Timeframe</span>' +
                '<span style="font-size:0.72rem;color:#a855f7;font-weight:600;">66% Complete</span>' +

                '</button>' +
              '</div>' +
            '</div>';

          html = 
            '<div class="mc-step-container">' +
              '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">' +
                '<span style="font-family:monospace;font-size:0.68rem;letter-spacing:2px;text-transform:uppercase;color:#10b981;font-weight:700;">Final Step &bull; Instant Report Access</span>' +

                '<span style="font-size:0.8rem;color:#10b981;font-weight:700;display:block;margin-bottom:2px;">✦ High Candidate Probability Detected</span>' +
                '<span style="font-size:0.75rem;color:#cbd5e1;line-height:1.35;display:block;">Your responses indicate strong alignment with 10-second CustomVue® dual-laser treatment.</span>' +
              '</div>' +

              '<form id="mc-final-form" style="display:flex;flex-direction:column;gap:12px;text-align:left;">' +

                  '<label for="mc-name" style="font-size:0.8rem;color:#cbd5e1;font-weight:600;display:block;margin-bottom:4px;">Full Name *</label>' +
                  '<input type="text" id="mc-name" required placeholder="Your Full Name" value="' + state.name + '" style="width:100%;padding:10px 14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.12);border-radius:10px;color:#fff;font-size:0.9rem;">' +
                '</div>' +
                '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">' +
                  '<div>' +
                    '<label for="mc-phone" style="font-size:0.8rem;color:#cbd5e1;font-weight:600;display:block;margin-bottom:4px;">Phone Number *</label>' +
                    '<input type="tel" id="mc-phone" required placeholder="(973) 555-0100" value="' + state.phone + '" style="width:100%;padding:10px 14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.12);border-radius:10px;color:#fff;font-size:0.9rem;">' +
                  '</div>' +
                  '<div>' +
                    '<label for="mc-email" style="font-size:0.8rem;color:#cbd5e1;font-weight:600;display:block;margin-bottom:4px;">Email Address *</label>' +
                    '<input type="email" id="mc-email" required placeholder="name@domain.com" value="' + state.email + '" style="width:100%;padding:10px 14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.12);border-radius:10px;color:#fff;font-size:0.9rem;">' +
                  '</div>' +

        if (window.CallRail && typeof window.CallRail.swap === 'function') {
          window.CallRail.swap();
        }
      }

      function bindEvents() {
        if (state.step === 1) {
          var cards = mcCard.querySelectorAll('.mc-option-card');
          cards.forEach(function(card) {
            card.addEventListener('click', function() {
              state.struggle = card.getAttribute('data-val');
              render();
            });
          });
          var nextBtn = mcCard.querySelector('#mc-next-1');
          if (nextBtn) {
            nextBtn.addEventListener('click', function() {
              if (state.struggle) {
                state.step = 2;
                render();
              }
            });
          }
        } else if (state.step === 2) {
          var cards = mcCard.querySelectorAll('.mc-option-card');
          cards.forEach(function(card) {
            card.addEventListener('click', function() {
              state.timeframe = card.getAttribute('data-val');
              render();
            });
          });
          var backBtn = mcCard.querySelector('#mc-back-1');
          if (backBtn) {
            backBtn.addEventListener('click', function() {
              state.step = 1;
              render();
            });
          }
          var nextBtn = mcCard.querySelector('#mc-next-2');
          if (nextBtn) {
            nextBtn.addEventListener('click', function() {
              if (state.timeframe) {
                state.step = 3;
                render();
              }
            });
          }
        } else if (state.step === 3) {
          var backBtn = mcCard.querySelector('#mc-back-2');
          if (backBtn) {
            backBtn.addEventListener('click', function() {
              state.step = 2;
              render();
            });
          }
          var form = mcCard.querySelector('#mc-final-form');
          if (form) {
            form.addEventListener('submit', function(e) {
              e.preventDefault();
              state.name = mcCard.querySelector('#mc-name').value;
              state.phone = mcCard.querySelector('#mc-phone').value;
              state.email = mcCard.querySelector('#mc-email').value;
              state.location = mcCard.querySelector('#mc-location').value;

              // Post to Netlify forms endpoint
              var body = 'form-name=consultation&name=' + encodeURIComponent(state.name) +
                '&phone=' + encodeURIComponent(state.phone) +
                '&email=' + encodeURIComponent(state.email) +
                '&location=' + encodeURIComponent(state.location) +
                '&timeframe=' + encodeURIComponent(state.timeframe) +
                '&message=' + encodeURIComponent('Primary struggle: ' + state.struggle);

              fetch('/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: body
              }).catch(function(err) {
                console.error('Submission error:', err);
              });

              state.step = 4;
              render();
            });
          }
        }
      }

      // Replace existing consultation form card with interactive micro-commitment card
      var bookingCard = document.querySelector('#booking .glass-panel') || document.querySelector('.contact-form') || heroFormCard;
      if (bookingCard && bookingCard.parentNode) {
        bookingCard.parentNode.replaceChild(mcCard, bookingCard);
        render();
      }
    }

    window.addEventListener('load', function() {
      buildFooter();
      initHeroMicroCommitmentFlow();

      // Initial single sweep on load
      scheduleSweep();

      // Single observer for dynamic content updates
      observer = new MutationObserver(scheduleSweep);
      observer.observe(document.getElementById('root') || document.body, {
        childList: true,
        subtree: true
      });
    });
  </script>
